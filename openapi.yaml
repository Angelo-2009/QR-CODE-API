openapi: 3.0.3
info:
  title: QR-CODE-API
  version: 0.1.0
servers:
  - url: http://localhost:3000
paths:
  /api/v1/qrcode/generate:
    post:
      summary: Generate a QR code from a JSON configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRCodeRequest'
      responses:
        '200':
          description: Synchronous generation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCodeResponse'
  /api/v1/qrcode/presets:
    get:
      summary: List built-in design presets
      responses:
        '200':
          description: presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DesignPreset'
components:
  schemas:
    ColorConfig:
      type: object
      oneOf:
        - properties:
            type: { const: "solid" }
            color: { type: string }
        - properties:
            type: { const: "linear" }
            angle: { type: number }
            stops:
              type: array
              items:
                type: object
                properties:
                  color: { type: string }
                  offset: { type: number }
        - properties:
            type: { const: "radial" }
            cx: { type: number }
            cy: { type: number }
            r: { type: number }
            stops:
              type: array
              items:
                type: object
                properties:
                  color: { type: string }
                  offset: { type: number }
    BackgroundConfig:
      type: object
      properties:
        type:
          type: string
          enum: [solid, image, transparent]
        color:
          type: string
        image:
          type: string
          description: data URL or preset:<name> (no remote URLs in starter)
        size:
          type: string
          enum: [cover, contain, stretch]
        position:
          type: string
          enum: [center, top, bottom, left, right]
        blur:
          type: number
        brightness:
          type: number
        overlay:
          type: object
          properties:
            color: { type: string }
            opacity: { type: number }
    QRCodeRequest:
      type: object
      required: [data, format]
      properties:
        data:
          type: string
        type:
          type: string
          enum: [url, text, vcard, wifi, tel, sms, email, geo, event, payment]
        format:
          type: string
          enum: [svg, png, webp, pdf, avif]
        size:
          type: integer
          minimum: 64
        error_correction:
          type: string
          enum: [L, M, Q, H]
        version:
          type: string
        encoding:
          type: string
        modules:
          type: object
          properties:
            shape:
              type: string
              description: Module shape (square, rounded, circle, diamond, hexagon, triangle, star, hbar, vbar, squircle)
            size:
              type: number
              description: Module size multiplier (scale)
            gap:
              type: number
              description: Gap between modules (0..0.5)
            corner_radius:
              type: number
            color:
              $ref: '#/components/schemas/ColorConfig'
            randomize:
              type: object
              properties:
                enabled: { type: boolean }
                min: { type: number }
                max: { type: number }
                seed: { type: number }
        finder:
          type: object
          properties:
            shape: { type: string }
            size: { type: number }
            corner_radius: { type: number }
            inner_dot: { type: boolean }
            color: { $ref: '#/components/schemas/ColorConfig' }
            inner_color: { $ref: '#/components/schemas/ColorConfig' }
        timing:
          type: object
          properties:
            style: { type: string, enum: [solid, dashed, dotted, gradient] }
            color: { $ref: '#/components/schemas/ColorConfig' }
            thickness: { type: number }
            gradientStops: { type: array, items: { type: string } }
        alignment:
          type: object
          properties:
            shape: { type: string }
            color: { $ref: '#/components/schemas/ColorConfig' }
            size: { type: number }
        colors:
          type: object
          properties:
            modules: { $ref: '#/components/schemas/ColorConfig' }
            finder: { $ref: '#/components/schemas/ColorConfig' }
            timing: { $ref: '#/components/schemas/ColorConfig' }
            alignment: { $ref: '#/components/schemas/ColorConfig' }
            background: { $ref: '#/components/schemas/ColorConfig' }
        background:
          $ref: '#/components/schemas/BackgroundConfig'
        quiet_zone:
          type: integer
          description: Quiet zone width in modules (default 4, range 0..10)
        logo:
          type: object
        margin:
          type: integer
        strict_mode:
          type: boolean
    QRCodeResponse:
      type: object
      properties:
        id:
          type: string
        content_type:
          type: string
        data_base64:
          type: string
        file_url:
          type: string
        scannability_score:
          type: number
        warnings:
          type: array
          items:
            type: string
    DesignPreset:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        config: { type: object }
